name: Deploy to cPanel

# Publishes the site to the cPanel hosting over FTPS on every push to main,
# including every save made in Moto Market Studio. It stays switched off
# until the three FTP secrets exist, so it never fails before setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Waiting for FTP secrets
        if: env.HAS_FTP != 'true'
        run: echo "Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings > Secrets and variables > Actions to switch cPanel publishing on."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - name: Upload changed files
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            *.md
            node_modules/**
            supabase/**
            tests/**
            scripts/**
            package.json
            package-lock.json
